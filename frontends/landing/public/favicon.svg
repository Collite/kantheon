<!--
  Tatrman favicon — the head alone.
  The manual is explicit about this: "scales to favicon — at 16 px, use the head
  alone (yellow dot + eyes)". The bar, strings and rows collapse into mush at that
  size; the head still reads as a face.
  Source: project/common/graphics/tatrman.html
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Tatrman">
  <defs>
    <linearGradient id="f" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFCB2E"/>
      <stop offset="1" stop-color="#F2A200"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#f)"/>
  <circle cx="22.5" cy="28" r="4.2" fill="#4A4B4D"/>
  <circle cx="41.5" cy="28" r="4.2" fill="#4A4B4D"/>
</svg>
