server {
  port = 7901
  host = "0.0.0.0"
}

# HOCON `${?VAR}` substitution: if the env var is unset, the line is dropped
# and the preceding value wins. Env vars exist as escape hatches so the K8s
# overlays can point at ai-platform services without rebuilding the image.
themis {
  // fork Stage 2.6 switch-over: Themis now calls the in-repo kantheon engines'
  // REST APIs directly — Nlp /v1/analyze (was ai-platform nlp-service:8000)
  // and Fuzzy /match (was fuzzy-mcp:7143). NLP_*/FUZZY_* env names kept stable.
  nlp {
    host = "nlp"
    host = ${?NLP_MCP_HOST}
    port = 7270
    port = ${?NLP_MCP_PORT}
    timeout-ms = 30000
    timeout-ms = ${?NLP_MCP_TIMEOUT_MS}
  }

  fuzzy {
    host = "fuzzy"
    host = ${?FUZZY_MCP_HOST}
    port = 7265
    port = ${?FUZZY_MCP_PORT}
    timeout-ms = 15000
    timeout-ms = ${?FUZZY_MCP_TIMEOUT_MS}
  }

  // fork Stage 2.5: the LLM gateway is now in-repo LLM gateway (was ai-platform
  // llm-gateway:8090). HTTP port 7280. Env overrides unchanged.
  llm-gateway {
    host = "llm-gateway"
    host = ${?LLM_GATEWAY_HOST}
    port = 7280
    port = ${?LLM_GATEWAY_PORT}
    timeout-ms = 60000
    timeout-ms = ${?LLM_GATEWAY_TIMEOUT_MS}
    // Gateway 2.0 gates every route on a per-consumer `ttrk-…` key (LG-P6·S1). Empty = send
    // none, which only works against a 1.x/unkeyed gateway. In-cluster this MUST be set, or
    // every LLM call silently returns an empty body and routing degrades to a blank
    // clarification rather than failing.
    api-key = ""
    api-key = ${?LLM_GATEWAY_KEY}
  }

  // capabilities-mcp registry — routeToAgent reads agent manifests (Stage 3.3).
  capabilities {
    host = "capabilities-mcp"
    host = ${?CAPABILITIES_MCP_HOST}
    port = 7501
    port = ${?CAPABILITIES_MCP_PORT}
    timeout-ms = 5000
    timeout-ms = ${?CAPABILITIES_MCP_TIMEOUT_MS}
  }

  hmac {
    secret-key = ${?HMAC_SECRET_KEY}
  }

  // These five keys had a literal but no `${?VAR}` line, which made their env
  // overrides dead: `ResolverConfig`'s `*OrEnv` helpers read `System.getenv` only
  // when `getX(path)` THROWS — i.e. only when the key is absent here. A key present
  // with a literal therefore wins silently. Setting `CONFIDENCE_THRESHOLD=0.55` on
  // the hartland pod had no effect at all: the gate kept comparing against 0.75, so
  // a 0.62-confidence turn asked "Which interpretation did you mean?" instead of
  // resolving (and, because AwaitingClarification is a different `oneof` branch than
  // Resolution, that also silently withdrew the agent-routing chips).
  cache {
    nlp-lru-size = 1000
    nlp-lru-size = ${?NLP_CACHE_SIZE}
    resolution-lru-size = 1000
    resolution-lru-size = ${?RESOLUTION_CACHE_SIZE}
  }

  hitl {
    confidence-threshold = 0.75
    confidence-threshold = ${?CONFIDENCE_THRESHOLD}
    max-rounds = 3
    max-rounds = ${?HITL_MAX_ROUNDS}
  }

  eval {
    corpus-path = "eval/corpus/seed.jsonl"
    corpus-path = ${?EVAL_CORPUS_PATH}
  }
}
