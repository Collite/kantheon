ktor {
    deployment {
        port = 7410
        port = ${?IRIS_BFF_HTTP_PORT}

        # Netty only. Caps TIME-TO-FIRST-BYTE for a streaming response, not just inter-frame
        # gaps — this is the knob that took the Hartland demo down on 2026-07-29 while it was
        # an invisible library default of 10s. MUST stay above `iris.stream.heartbeat-s`.
        # Declared here so it is tunable and greppable rather than inherited silently; the
        # value matches ktor-configurator's own default (ST-P2). Read the live value off the
        # `iris stream: heartbeat=…, engine response-write-timeout=…` startup line.
        # See project/server/features/stream-timeouts/ contracts §3 (review-078 R3).
        response-write-timeout-s = 180
        response-write-timeout-s = ${?KTOR_RESPONSE_WRITE_TIMEOUT_S}
    }
    application {
        modules = [ org.tatrman.kantheon.iris.ApplicationKt.module ]
    }
}

telemetry {
    enabled = false
    enabled = ${?OTEL_ENABLED_IRIS_BFF}
}

# Request logging (PT Phase 0 / GI-7). Presence of this block is what makes the
# shared `installKtorServerBase` install Ktor's CallLogging at INFO — with the
# k8s liveness/readiness probes filtered out by `ProbePaths`, so a pod does not
# log a line every few seconds forever. With the OTel Logback appender wired,
# these lines reach Loki carrying the turn's `trace_id`.
callLogging {}

# Iris-BFF v1 (kantheon — Iris arc).
iris {
    # The language agents answer in when a turn carries none. Golem picks its prompt
    # bundle by this (`prompts/<locale>/intent.yaml`), so it sets the language of answer
    # captions and follow-up chips — a cs default on an English estate produces Czech
    # captions over US data. The SPA sends the picker's value per turn; this is the
    # fallback for callers that don't (Hebe's scheduled turns, curl, older FE builds).
    locale = "cs"
    locale = ${?IRIS_LOCALE}

    # Postgres (Kantheon PG, `iris` database — kantheon-architecture §7.1).
    # Read at boot when iris.db.enabled = true; the in-memory store backs
    # unit/component tests and local boot without a database.
    db {
        enabled = false
        enabled = ${?IRIS_DB_ENABLED}
        type = "POSTGRES"
        host = "kantheon-postgres"
        host = ${?IRIS_DB_HOST}
        port = "5432"
        port = ${?IRIS_DB_PORT}
        database = "iris"
        database = ${?IRIS_DB_NAME}
        user = "iris"
        user = ${?IRIS_DB_USER}
        password = "iris"
        password = ${?IRIS_DB_PASSWORD}
    }

    auth {
        # When true, a JWKS-backed RS256 verifier validates the bearer signature +
        # iss/aud/exp before any claim is trusted (Stage 1.4). When false (local/dev
        # default), the bearer is decoded for sub/tenant + exp only — no signature
        # check. Either way a malformed/absent bearer 401s.
        verify-signature = false
        verify-signature = ${?IRIS_AUTH_VERIFY_SIGNATURE}
        # JWKS source: an explicit jwks-uri wins; otherwise it is derived from
        # keycloak-issuer as "<issuer>/protocol/openid-connect/certs".
        keycloak-issuer = ${?IRIS_AUTH_KEYCLOAK_ISSUER}
        jwks-uri = ${?IRIS_AUTH_JWKS_URI}
        audience = ${?IRIS_AUTH_AUDIENCE}
        # Claim names (Keycloak realm-dependent).
        tenant-claim = "tenant"
        tenant-claim = ${?IRIS_AUTH_TENANT_CLAIM}
        default-tenant = "default"
    }

    # Hash-chained audit (PD-8, contracts §3.1). The Ed25519 signing keypair is
    # loaded from this ref (a mounted K8s Secret file path, or inline PEM holding
    # both PRIVATE KEY + PUBLIC KEY blocks). Unset → an ephemeral dev keypair
    # (warning logged); a chain signed with an ephemeral key cannot be verified
    # across restarts, so production MUST set this.
    audit {
        signing-key-ref = ${?IRIS_AUDIT_SIGNING_KEY_REF}
    }

    # Themis routing edge (Phase 3 Stage 3.1, contracts §6). Every turn resolves
    # through `POST {base-url}/v1/resolve` before dispatch; the caller's bearer is
    # forwarded OBO. Unreachable → THEMIS_UNAVAILABLE error envelope (warn-and-fail
    # the turn, never the server).
    themis {
        base-url = "http://themis:8080"
        base-url = ${?IRIS_THEMIS_BASE_URL}
        timeout-ms = 10000
        timeout-ms = ${?IRIS_THEMIS_TIMEOUT_MS}
    }

    # Capabilities-mcp read mirror — display names + alternates for RoutingPickChip
    # labels (Phase 3). Best-effort: unreachable → chips fall back to the raw agent id.
    capabilities {
        # Port 7501 is capabilities-mcp's actual service port (its chart, and Themis's
        # `capabilities.port` default, both use it). This default said 8080 and so never
        # connected in any deployment — the only symptom was a connect TIMEOUT logged at WARN
        # and an empty /v1/discover surface, because the client is best-effort by design.
        base-url = "http://capabilities-mcp:7501"
        base-url = ${?IRIS_CAPABILITIES_BASE_URL}
    }

    # Pythia (the investigation inbox + submit, PD-2 / Pythia arc Stage 5.2). Blank →
    # FakePythiaClient (local/tests); a URL wires the live HTTP client over Pythia's
    # REST control surface (submit + per-user list; the SSE bridge feeds the inbox
    # lifecycle infra). The user's OBO bearer is forwarded — never service identity.
    pythia {
        url = ""
        url = ${?IRIS_PYTHIA_URL}
    }

    # Transitional new-golem /v2 dispatch (contracts §5). Deleted at Golem cutover.
    dispatch {
        golem-v2 {
            base-url = "http://golem-v2:8080"
            base-url = ${?IRIS_GOLEM_V2_BASE_URL}
        }
        # Agent-id → **native Golem** endpoint, as `id=url,id=url`.
        #
        # Themis routes to the agent id registered in capabilities-mcp (`golem-hartland`, …),
        # but the dispatch map is otherwise keyed only on the placeholder `golem-v2` — so a
        # correct routing decision fails at the dispatcher with "No dispatch client registered
        # for agent '<id>'". List the real ids here. A multi-golem estate needs this anyway:
        # one base-url cannot address two golems on separate Services.
        #
        # These ids dispatch over the native `/v1/answer` surface, NOT `golem-v2`'s /v2 one —
        # a kantheon Golem serves /v1/answer, /v1/answer/sync, /v1/resume, /v1/refresh and
        # nothing else. The id must equal the pod's loaded Shem (`golem_id`), which is what
        # capabilities-mcp registers, so routing and admission agree on one name.
        #
        # Empty (the default) keeps the single-endpoint Phase-3 behaviour.
        agent-endpoints = ""
        agent-endpoints = ${?IRIS_AGENT_ENDPOINTS}
    }

    # /protocol — the session-protocol surface (PT arc, contracts §7).
    #
    # PT-2: what a protocol CONTAINS is a platform decision, not a user preference.
    # Nothing here is reachable from a request; a caller picks neither profile nor
    # verbosity. A malformed block degrades to the shipped defaults with a warning
    # rather than failing boot — /protocol is a debug surface and must never stop
    # iris-bff from serving turns.
    protocol {
        default-profile = "default"
        default-profile = ${?IRIS_PROTOCOL_DEFAULT_PROFILE}

        profiles {
            # Verbosity per registry key (contracts §2): off | summary | full.
            # `receipts` is deliberately absent and CANNOT be added — PT-13 makes it
            # non-configurable, and the loader warns and ignores any attempt. A
            # protocol whose receipts could be switched off could not be audited:
            # the reader would have no way to tell a complete document from a
            # silently degraded one.
            default {
                sections {
                    header = full
                    resolution = full
                    llm-calls = summary
                    query = full
                    plan = full
                    sql = full
                    security = full
                    execution = full
                    service-logs = summary
                    errors = full
                    participants = full
                }
                # PT-20/21: prompt bodies are the most sensitive thing a protocol can
                # carry. User content is what the reader asked for; system content is
                # digested by default because it leaks prompt engineering, not facts
                # about this turn.
                llm-calls {
                    user-content = full
                    system-content = summary
                }
            }
        }

        # Hard caps (PT-10). A hit sets `Section.truncated` and is reported in the
        # receipts — the document says what it dropped rather than quietly eliding it.
        caps {
            service-logs-lines = 200
            llm-message-chars = 4000
            sql-chars = 20000
        }

        # Turns beyond this in a session-scope render get the index + chapter
        # treatment rather than one flat wall (Q-17 may retune from the p95 baseline).
        session-split-threshold = 12
        session-split-threshold = ${?IRIS_PROTOCOL_SESSION_SPLIT_THRESHOLD}

        # Federated read sources. Empty base-url = source unavailable → the assembler
        # degrades that section and says so in the receipts (P-4), never fabricates.
        sources {
            gateway-base-url = ""
            gateway-base-url = ${?IRIS_PROTOCOL_GATEWAY_BASE_URL}
            loki-base-url = ""
            loki-base-url = ${?IRIS_PROTOCOL_LOKI_BASE_URL}
            # X-Scope-OrgID. Required by any Loki with `auth_enabled: true` — without it
            # every query is a 401, whatever the bearer says. The tenant id is whatever
            # the estate's collector writes under, so it cannot be derived here.
            loki-tenant = ""
            loki-tenant = ${?IRIS_PROTOCOL_LOKI_TENANT}
            tempo-base-url = ""
            tempo-base-url = ${?IRIS_PROTOCOL_TEMPO_BASE_URL}
            # S-1: reconstruct the RelPlan via the translator when the turn did not
            # carry one. Labelled `reconstructed` in the document when it happens.
            translate-explain {
                enabled = true
                enabled = ${?IRIS_PROTOCOL_TRANSLATE_EXPLAIN_ENABLED}
            }
        }
    }

    stream {
        # SSE idle heartbeat (`:heartbeat` comment frame) — keeps proxies from
        # reaping a long-running but quiet dispatch (contracts §2.3).
        #
        # Was 15s, which is ABOVE Ktor Netty's 10s `responseWriteTimeoutSeconds` default —
        # so before the `: ready` preamble existed, the socket was reaped before the first
        # heartbeat could fire and the user got a 502.
        #
        # MEASURED 2026-07-29 (ST-P1·S1): the engine's write timeout caps TIME-TO-FIRST-BYTE
        # only. Once the response is committed, an idle gap does NOT trigger it — a stream
        # with the preamble survived a 15s silent gap on a real Netty socket with this set
        # to 60s. So the preamble in SseStream is what actually fixes the engine problem;
        # this value is defence-in-depth, and it still earns its keep against PROXY idle
        # read timeouts, which are a separate family of cut. 5s matches golem's
        # `PING_INTERVAL_MS`. Guarded by SsePreambleSpec.
        # See project/server/features/stream-timeouts/.
        heartbeat-s = 5
        heartbeat-s = ${?IRIS_STREAM_HEARTBEAT_S}
    }
}
