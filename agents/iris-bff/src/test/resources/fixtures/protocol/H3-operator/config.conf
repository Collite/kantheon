# H3-operator — the operator's view: cost, latency and what ran, without the
# prompt bodies or the reasoning prose. Proves verbosity actually changes the
# document rather than only the rendering.
iris.protocol {
  default-profile = "operator"
  profiles {
    operator {
      sections {
        header = full, resolution = summary, llm-calls = summary,
        query = full, plan = off, sql = summary, security = full,
        execution = full, service-logs = summary, errors = full,
        participants = full
      }
      llm-calls { user-content = summary, system-content = off }
    }
  }
  caps { service-logs-lines = 200, llm-message-chars = 4000, sql-chars = 20000 }
  session-split-threshold = 12
}
