# injection — hostile content in every field the renderer fences or tables
# (review-079 R2/R3/R4). Profile is the shipped `default` with ONE change:
# llm-calls = full, so prompt and completion bodies are actually rendered. The
# rest of the injection surface (query, sql, plan, service-logs, the title) is
# reachable under the default profile exactly as shipped.
iris.protocol {
  default-profile = "default"
  profiles {
    default {
      sections {
        header = full, resolution = full, llm-calls = full,
        query = full, plan = full, sql = full, security = full,
        execution = full, service-logs = summary, errors = full,
        participants = full
      }
      llm-calls { user-content = full, system-content = summary }
    }
  }
  caps { service-logs-lines = 200, llm-message-chars = 4000, sql-chars = 20000 }
  session-split-threshold = 12
}
