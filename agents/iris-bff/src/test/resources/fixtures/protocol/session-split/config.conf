# session-split — 13 turns against a threshold of 12, so the index + chapter
# anchors must appear. v1 stays ONE markdown document with in-doc anchors; a
# genuine multi-document split is reserved (PT-10 γ), not implemented.
iris.protocol {
  default-profile = "default"
  profiles {
    default {
      sections {
        header = full, resolution = summary, llm-calls = off,
        query = full, plan = off, sql = full, security = full,
        execution = full, service-logs = off, errors = full, participants = full
      }
      llm-calls { user-content = summary, system-content = off }
    }
  }
  caps { service-logs-lines = 200, llm-message-chars = 4000, sql-chars = 20000 }
  session-split-threshold = 12
}
