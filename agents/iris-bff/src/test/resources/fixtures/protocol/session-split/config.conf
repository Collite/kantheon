# session-split — 13 turns against a threshold of 12, so the index + chapter
# anchors must appear. v1 stays ONE markdown document with in-doc anchors; a
# genuine multi-document split is reserved (PT-10 γ), not implemented.
#
# It is ALSO the only multi-turn case, which makes it the only one that can
# exercise the anchor rule (contracts A-9): sources are fetched once, for turn 1,
# so turns 2-13 must degrade `execution`, `service-logs`, `plan` and `llm-calls`
# rather than render turn 1's facts as their own. `plan` and `service-logs` were
# `off` here, and `llm-calls` too, which is a large part of why nobody saw the
# defect — three of the four affected sections were switched off in the one
# fixture that could have shown them (review-080 R1). They are on now.
iris.protocol {
  default-profile = "default"
  profiles {
    default {
      sections {
        header = full, resolution = summary, llm-calls = summary,
        query = full, plan = full, sql = full, security = full,
        execution = full, service-logs = summary, errors = full, participants = full
      }
      llm-calls { user-content = summary, system-content = off }
    }
  }
  caps { service-logs-lines = 200, llm-message-chars = 4000, sql-chars = 20000 }
  session-split-threshold = 12
}
