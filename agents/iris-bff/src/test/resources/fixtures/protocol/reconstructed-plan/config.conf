# H1-full — the shipped `default` profile (contracts §7), verbatim.
iris.protocol {
  default-profile = "default"
  profiles {
    default {
      sections {
        header = full, resolution = full, llm-calls = summary,
        query = full, plan = full, sql = full, security = full,
        execution = full, service-logs = summary, errors = full,
        participants = full
      }
      llm-calls { user-content = full, system-content = summary }
    }
  }
  caps { service-logs-lines = 200, llm-message-chars = 4000, sql-chars = 20000 }
  session-split-threshold = 12
}
