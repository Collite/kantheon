# truncation — caps set deliberately low so the marker fires. A protocol that
# hides its own truncation is worse than no protocol, so this case exists to
# keep the marker honest.
iris.protocol {
  default-profile = "default"
  profiles {
    default {
      sections {
        header = full, resolution = full, llm-calls = summary,
        query = full, plan = full, sql = full, security = full,
        execution = full, service-logs = full, errors = full, participants = full
      }
      llm-calls { user-content = full, system-content = summary }
    }
  }
  caps { service-logs-lines = 1, llm-message-chars = 4000, sql-chars = 20000 }
  session-split-threshold = 12
}
